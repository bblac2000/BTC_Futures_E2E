[project]
name = "btc-futures-e2e"
version = "0.1.0"
description = "BTCUSDT USDⓈ-M perpetual bot — paper first, live only after user approval + live checklist"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=17",
    # 🔒 exact pin — ccxt/ccxt.pro is part of the exchange-rules surface (registry). Upgrades = new registry row + re-run tier test.
    "ccxt==4.5.78",
    # 🔒 exact pin — trial #1 P1 placebo uses numpy Generator(PCG64)+SeedSequence(20260921); NumPy does not promise
    #    Generator streams across versions, so the pre-registered null is only reproducible on this exact version.
    "numpy==2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pyright>=1.1.380",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # aiohttp 3.14.3 inside ccxt.pro on py3.12.13 — harmless, upstream notice only
    "ignore:enable_cleanup_closed ignored:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# RUF001/RUF003 would flag the Korean prose that is normal in this codebase; not selected.
ignore = ["E501"]

[tool.pyright]
include = ["exchange", "sizing", "paper", "db", "data", "notify", "safety", "ops", "strategies", "scripts", "tests"]
exclude = ["var", ".venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
